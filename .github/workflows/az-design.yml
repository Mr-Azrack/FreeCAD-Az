name: Az Design add-on
on:
  # Test current trusted development branch directly; PR checks alone can
  # remain absent for a long-lived draft PR and do not represent every SHA.
  push:
    branches: [codex/az-design-workbench]
    paths:
      - 'addons/AzDesign/**'
      - 'native-core/windows/**'
      - '.github/workflows/az-native-patch.yml'
      - '.github/workflows/az-native-publish.yml'
      - '.github/workflows/az-design.yml'
      - 'tools/verify_native_workflows.py'
  pull_request:
    paths:
      - 'addons/AzDesign/**'
      - 'addons/Install_AzDesign.FCMacro'
      - 'tools/package_azdesign.py'
      - '.github/workflows/az-design.yml'
  workflow_dispatch:
permissions:
  contents: read

# Source edits can arrive as several commits in a single batch. Keep the
# most recent branch/PR revision only; obsolete check runs should not
# monopolize the runner or flood the user's Actions list.
concurrency:
  group: az-design-fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modeling:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install FreeCAD's native Python runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 freecad-python3
      - uses: actions/checkout@v4
        with:
          sparse-checkout: addons/AzDesign
      - name: Test exact geometry, parameters and history
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 addons/AzDesign/tests/run_workflow.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            addons/AzDesign
            addons/Install_AzDesign.FCMacro
            tools/package_azdesign.py
            tools/verify_native_workflows.py
            .github/workflows
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject malformed GitHub workflows and unsafe patch gates
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python tools/verify_native_workflows.py
      - name: Test installer backup and recovery
        run: python addons/AzDesign/tests/test_install.py
      - name: Test FreeCAD startup without __file__
        run: python addons/AzDesign/tests/test_startup.py
      - name: Test first command and hidden-document lifecycle
        run: python addons/AzDesign/tests/test_document_context.py
      - name: Test workspace preference and native sketch-color restoration
        run: python addons/AzDesign/tests/test_appearance.py
      - name: Test modern and legacy extrusion property contracts
        run: python addons/AzDesign/tests/test_compat.py
      - name: Test Qt5 / Qt6 task-panel button compatibility
        run: python addons/AzDesign/tests/test_qt_buttons.py
      - name: Test Extrude preview keeps Body visible while choosing profiles
        run: python addons/AzDesign/tests/test_extrude_preview_ui.py
      - name: Test Hole safety contracts and reversible preview
        run: |
          python addons/AzDesign/tests/test_hole_spec.py
          python addons/AzDesign/tests/test_hole_operation.py
          python addons/AzDesign/tests/test_hole_diagnostics.py
          python addons/AzDesign/tests/test_hole_ui_policy.py
          python addons/AzDesign/tests/test_hole_panel.py
      - name: Test in-app updater and backups without live GitHub downloads
        run: python addons/AzDesign/tests/test_updater.py
      - name: Verify Home, new-model and saved-workspace routing
        run: python addons/AzDesign/tests/test_workspace_route.py
      - name: Reject raw FreeCAD modeling tasks in Design ribbon
        run: python addons/AzDesign/tests/test_command_boundary.py
      - name: Test unified edit routes and canvas selection policy
        run: python addons/AzDesign/tests/test_interaction.py
      - name: Test native parametric Mirror/Pattern contracts and rollback
        run: python addons/AzDesign/tests/test_native_transform_contracts.py
      - name: Test Design-owned Pattern edit and live preview transactions
        run: python addons/AzDesign/tests/test_pattern_ui_contracts.py
      - name: Test persisted independent sketch-pattern ownership
        run: python addons/AzDesign/tests/test_pattern_records.py
      - name: Test original image-only history timeline assets
        run: python addons/AzDesign/tests/test_timeline_icons.py
      - name: Test Fusion video interaction-shortcut contracts
        run: python addons/AzDesign/tests/test_fusion_video_workflows.py
      - name: Test compact native Sketch Palette controls and theme-safe layout
        run: python addons/AzDesign/tests/test_sketch_palette.py
      - name: Test transactional associative sketch references
        run: python addons/AzDesign/tests/test_snap_targets_contracts.py
      - name: Test nonmutating body-edge hover integration
        run: python addons/AzDesign/tests/test_snap_overlay_body_contract.py
      - name: Test native sketch-pattern history timeline routing
        run: python addons/AzDesign/tests/test_pattern_timeline_contracts.py
      - name: Test automatic Sketcher hover midpoint and circle-center inference
        run: python addons/AzDesign/tests/test_snap_hover.py
      - name: Test passive native-Sketcher viewport hover overlay positioning
        run: python addons/AzDesign/tests/test_snap_overlay.py
      - name: Validate Python and XML, then build installer ZIP
        run: python tools/package_azdesign.py
      - uses: actions/upload-artifact@v4
        with:
          name: AzDesign-installer
          path: dist/AzDesign-*.zip
