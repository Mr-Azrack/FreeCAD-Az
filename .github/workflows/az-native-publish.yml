name: Publish approved Design Native patch

# Manual promotion only: an accepted CI artifact is not automatically a public release.
on:
  # Owner-approved one-time release request. Future versions get separate
  # reviewed requests; ordinary commits never cause release publication.
  push:
    branches: [main]
    paths:
      - '.github/release-requests/native-0.5.9.txt'
  workflow_dispatch:
    inputs:
      verified_run:
        description: 'Successful Az Native Windows Patch run ID containing the patch artifact'
        required: true
        type: string
      source_sha:
        description: 'Exact reviewed candidate source SHA'
        required: true
        type: string
      version:
        description: 'Destination version'
        required: true
        default: '0.5.9'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: native-release
    steps:
      - uses: actions/checkout@v4
      - name: Validate owner-approved one-time release request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/release-requests/native-0.5.9.txt
          test "$(cat .github/release-requests/native-0.5.9.txt)" = "publish v0.5.9 from verified patch CI run 42959009956 source 89cd91ba4e15381950db1543873320e90a0b80f0"
      - name: Validate requested release and upstream CI success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.verified_run || '42959009956' }}
          VERSION: ${{ inputs.version || '0.5.9' }}
          APPROVED_SHA: ${{ inputs.source_sha || '89cd91ba4e15381950db1543873320e90a0b80f0' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          [[ "$VERSION" == '0.5.9' ]] || { echo 'This promotion is pinned to the 0.5.8-to-0.5.9 candidate'; exit 1; }
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            [[ "$RUN_ID" == '42959009956' && "$APPROVED_SHA" == '89cd91ba4e15381950db1543873320e90a0b80f0' ]] || { echo 'Push publication must use reviewed 0.5.9 candidate'; exit 1; }
          fi
          [[ "$APPROVED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Reviewed source SHA must be 40 lowercase hex characters'; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID" --jq '{status,conclusion,name,head_branch,event,head_sha}' > /tmp/source.json
          jq -e --arg sha "$APPROVED_SHA" '.status=="completed" and .conclusion=="success" and .name=="Az Native Windows Patch" and .head_branch=="codex/az-design-workbench" and .head_sha==$sha' /tmp/source.json
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag already published: refusing overwrite.'
            exit 1
          fi
      - name: Download the verified CI patch artifact
        uses: actions/download-artifact@v4
        with:
          name: AzDesignNative-0.5.8-to-0.5.9-PATCH
          repository: Mr-Azrack/FreeCAD-Az
          run-id: ${{ inputs.verified_run || '42959009956' }}
          github-token: ${{ github.token }}
          path: approved
      - name: Revalidate patch SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd approved
          test -f AzDesignNative-0.5.8-to-0.5.9.azpatch
          test -f AzDesignNative-0.5.8-to-0.5.9.azpatch.sha256
          sha256sum -c AzDesignNative-0.5.8-to-0.5.9.azpatch.sha256
      - name: Retain prior verified 0.5.7-to-0.5.8 update for in-app multi-step upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p approved-prior
          gh release download v0.5.8 \
            --repo "$GITHUB_REPOSITORY" \
            --dir approved-prior \
            --pattern 'AzDesignNative-0.5.7-to-0.5.8.azpatch*'
          (cd approved-prior && sha256sum -c AzDesignNative-0.5.7-to-0.5.8.azpatch.sha256)
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.5.9 \
            approved/AzDesignNative-0.5.8-to-0.5.9.azpatch \
            approved/AzDesignNative-0.5.8-to-0.5.9.azpatch.sha256 \
            approved-prior/AzDesignNative-0.5.7-to-0.5.8.azpatch \
            approved-prior/AzDesignNative-0.5.7-to-0.5.8.azpatch.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Design Native 0.5.9" \
            --notes "Verified incremental patch from public 0.5.8 Build #39 to 0.5.9. Owner video driven upgrades: sensible plate-with-cutouts Extrude region, face-first Create Sketch, canvas-selected Sketch Pattern source and nonmodal Design Fillet/Chamfer with parametric history edit. Full CI source run 42959009956, SHA 89cd91ba4e15381950db1543873320e90a0b80f0. The earlier 0.5.7-to-0.5.8 patch remains attached for one-version-behind updates. Keep documents saved; patch installer preserves rollback. Real Windows user interaction acceptance is still requested." \
            --latest
