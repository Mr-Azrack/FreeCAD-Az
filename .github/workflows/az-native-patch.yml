name: Az Native Windows Patch

# Routine modeling/UI changes take this path. Do not rebuild or publish the
# 1.8 GB installer for every source change.
# Deliberate batch gate. Daily modeling commits run the fast az-design.yml
# suite; the full installed-baseline patch/rollback test runs only when
# .github/validation-requests/native-0.5.10.txt changes on the trusted branch.
# Never run this expensive job automatically for every PR/feature commit.
on:
  push:
    branches: [codex/az-design-workbench]
    paths:
      - '.github/validation-requests/native-0.5.10.txt'
  workflow_dispatch:
    inputs:
      cold_validation:
        description: 'Force fresh pinned installer download, all older patches and real uninstall'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: az-native-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  geometry:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install FreeCAD native Python geometry engine
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 freecad-python3
      - uses: actions/checkout@v4
        with:
          sparse-checkout: addons/AzDesign
      - name: Verify real sketch solver and 2x2 four-hole Hole integration
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 addons/AzDesign/tests/run_workflow.py
  patch:
    needs: [geometry]
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check Python UI and sketch workflow
        run: |
          python -m compileall -q addons/AzDesign/azdesign
          if ($LASTEXITCODE -ne 0) { throw 'Design UI or Sketcher Python syntax failed' }
      - name: Batch gate — headless add-on tests before downloading native baseline
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'test_install.py', 'test_startup.py', 'test_document_context.py',
            'test_appearance.py', 'test_compat.py', 'test_qt_buttons.py',
            'test_extrude_preview_ui.py', 'test_hole_spec.py',
            'test_hole_operation.py', 'test_hole_diagnostics.py',
            'test_hole_ui_policy.py', 'test_hole_panel.py', 'test_updater.py',
            'test_workspace_route.py', 'test_command_boundary.py',
            'test_interaction.py', 'test_native_transform_contracts.py',
            'test_pattern_ui_contracts.py', 'test_timeline_icons.py',
            'test_fusion_video_workflows.py',
            'test_sketch_palette.py', 'test_snap_hover.py',
            'test_snap_overlay.py'
          )
          foreach ($test in $tests) {
            python "addons/AzDesign/tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Batch gate failed at $test. Native baseline download skipped." }
          }
      - name: Verify native launcher suppresses first splash safely
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:windir 'Microsoft.NET\\Framework\\v4.0.30319\\csc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'AzNativeLauncherProfileTests.exe'
          $launcher = (Resolve-Path 'native-core/windows/AzDesignLauncher.cs').Path
          $test = (Resolve-Path 'native-core/windows/test_launcher_profile.cs').Path
          & $csc /nologo /target:exe "/out:$exe" /main:TestNativeLauncherProfile /reference:System.Windows.Forms.dll /reference:System.Xml.dll "$launcher" "$test"
          if ($LASTEXITCODE -ne 0) { throw 'Native launch profile compilation failed' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Native first-launch splash or config-preservation test failed' }
      - name: Verify release metadata and patch safety contracts
        run: |
          $ErrorActionPreference = 'Stop'
          $csc = Join-Path $env:windir 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'AzOnlineUpdateTests.exe'
          $onlineSource = (Resolve-Path 'native-core/windows/AzOnlineUpdates.cs').Path
          $testsSource = (Resolve-Path 'native-core/windows/test_online_updates.cs').Path
          & $csc /nologo /target:exe "/out:$exe" /reference:System.Web.Extensions.dll "$onlineSource" "$testsSource"
          if ($LASTEXITCODE -ne 0) { throw 'C# updater metadata compilation failed' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw 'Updater metadata policy failed' }
          python native-core/windows/test_create_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Delta manifest tests failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/test_apply_patch.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows patch/rollback tests failed' }
      # Restore the pinned installed 0.5.6 base instead of repeating the
      # multi-gigabyte installer download and installation for each candidate.
      # This exact key contains all three pinned CI run IDs.
      # Only trusted development branch/manual builds use this cache.
      - name: Restore pinned installed 0.5.6 baseline cache
        id: baseline_cache
        if: github.event_name != 'workflow_dispatch' || !inputs.cold_validation
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/DesignInstalled054
          key: az-native-056-win2022-42809599278-42819472920-42871091253-v1

      - name: Validate cached 0.5.6 baseline before use
        if: steps.baseline_cache.outputs.cache-hit == 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'DesignInstalled054'
          $hashManifest = Join-Path $baseline '.az-baseline-hashes.json'
          if (!(Test-Path $hashManifest)) { throw 'Cached baseline missing integrity manifest; run cold validation.' }
          $expected = Get-Content $hashManifest -Raw | ConvertFrom-Json
          $required = @(
            'bin\FreeCAD.exe', 'bin\python.exe', 'AzUpdater.exe',
            'AzDesign.exe', 'ApplyAzPatch.ps1', 'AZ Native Version.json',
            'Mod\AzDesign\InitGui.py', 'unins000.exe'
          )
          foreach ($relative in $required) {
            $absolute = Join-Path $baseline $relative
            if (!(Test-Path -LiteralPath $absolute -PathType Leaf)) {
              throw "Cached baseline incomplete: $relative"
            }
          }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.product -ne 'AzDesignNative' -or $marker.version -ne '0.5.6') {
            throw 'Cached baseline is not pinned installed 0.5.6'
          }
          foreach ($entry in $expected.PSObject.Properties) {
            $file = Join-Path $baseline $entry.Name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing cached file: $($entry.Name)" }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne [string]$entry.Value) {
              throw "Cached baseline integrity failure: $($entry.Name)"
            }
          }
          $baseline | Set-Content 'baseline-path.txt'
          Write-Host 'Pinned 0.5.6 baseline cache restored; skipped original installer and patch reconstruction.'

      - name: Clear incomplete baseline staging on cache miss
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'DesignInstalled054'
          if (Test-Path -LiteralPath $path) {
            Remove-Item -LiteralPath $path -Recurse -Force
          }

      - name: Download original, tested 0.5.4 installer
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: AzDesign-Native-Windows-Installer-0.5.4
          repository: Mr-Azrack/FreeCAD-Az
          run-id: 42809599278
          github-token: ${{ github.token }}
          path: baseline-installer
      - name: Verify baseline SHA256 and install real 0.5.4
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'baseline-installer' -Recurse -File -Filter 'AzDesign-Native-Setup-0.5.4-x64.exe' | Select-Object -First 1
          $checksum = Get-ChildItem 'baseline-installer' -Recurse -File -Filter 'AzDesign-Native-Setup-0.5.4-x64.sha256' | Select-Object -First 1
          if (!$setup -or !$checksum) { throw 'Pinned baseline installer or checksum missing' }
          $expected = ((Get-Content $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$') { throw 'Baseline checksum malformed' }
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Baseline installer checksum mismatch' }
          $baseline = Join-Path $env:RUNNER_TEMP 'DesignInstalled054'
          $proc = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$baseline") -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Could not install baseline: $($proc.ExitCode)" }
          foreach ($file in @('bin\FreeCAD.exe','bin\python.exe','AzUpdater.exe','Mod\AzDesign','ApplyAzPatch.ps1','AZ Native Version.json','unins000.exe')) {
            if (!(Test-Path (Join-Path $baseline $file))) { throw "Baseline missing $file" }
          }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.product -ne 'AzDesignNative' -or $marker.version -ne '0.5.4') { throw 'Wrong baseline product/version' }
          $baseline | Set-Content 'baseline-path.txt'
      - name: Download verified 0.5.5 patch used by installed owner
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: AzDesignNative-0.5.4-to-0.5.5-PATCH
          repository: Mr-Azrack/FreeCAD-Az
          run-id: 42819472920
          github-token: ${{ github.token }}
          path: installed-055-patch
      - name: Reconstruct actual 0.5.5 installed baseline
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $oldPatch = Get-ChildItem 'installed-055-patch' -Recurse -File -Filter 'AzDesignNative-0.5.4-to-0.5.5.azpatch' | Select-Object -First 1
          $checksum = Get-ChildItem 'installed-055-patch' -Recurse -File -Filter 'AzDesignNative-0.5.4-to-0.5.5.azpatch.sha256' | Select-Object -First 1
          if (!$oldPatch -or !$checksum) { throw 'Tested 0.5.5 patch artifact missing' }
          $expected = ((Get-Content $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $oldPatch.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $actual -ne $expected) { throw '0.5.5 patch checksum mismatch' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/ApplyAzPatch.ps1 -InstallDir "$baseline" -PatchZip "$($oldPatch.FullName)" -NoUI
          if ($LASTEXITCODE -ne 0) { throw '0.5.4 installation rejected verified 0.5.5 patch' }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.product -ne 'AzDesignNative' -or $marker.version -ne '0.5.5') { throw 'Wrong reconstructed 0.5.5 baseline' }
      - name: Download pinned tested 0.5.6 patch from run 42871091253
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: AzDesignNative-0.5.5-to-0.5.6-PATCH
          repository: Mr-Azrack/FreeCAD-Az
          run-id: 42871091253
          github-token: ${{ github.token }}
          path: installed-056-patch
      - name: Reconstruct actual 0.5.6 installed baseline
        if: steps.baseline_cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $previous = Get-ChildItem 'installed-056-patch' -Recurse -File -Filter 'AzDesignNative-0.5.5-to-0.5.6.azpatch' | Select-Object -First 1
          $checksum = Get-ChildItem 'installed-056-patch' -Recurse -File -Filter 'AzDesignNative-0.5.5-to-0.5.6.azpatch.sha256' | Select-Object -First 1
          if (!$previous -or !$checksum) { throw 'Pinned 0.5.6 patch/checksum unavailable' }
          $expected = ((Get-Content $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $previous.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $actual -ne $expected) { throw 'Pinned 0.5.6 patch SHA256 mismatch' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/ApplyAzPatch.ps1 -InstallDir "$baseline" -PatchZip "$($previous.FullName)" -NoUI
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reconstruct installed 0.5.6 baseline' }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.version -ne '0.5.6') { throw 'Incorrect 0.5.6 reconstructed baseline' }
      - name: Record exact installed baseline hashes for future cache restores
        if: steps.baseline_cache.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.cold_validation)
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $files = @(
            'bin\FreeCAD.exe', 'bin\python.exe', 'AzDesign.exe',
            'AzUpdater.exe', 'ApplyAzPatch.ps1', 'AZ Native Version.json',
            'Mod\AzDesign\InitGui.py', 'unins000.exe'
          )
          $hashes = [ordered]@{}
          foreach ($file in $files) {
            $hashes[$file] = (Get-FileHash -LiteralPath (Join-Path $baseline $file) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $hashes | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $baseline '.az-baseline-hashes.json') -Encoding UTF8

      - name: Cache immutable 0.5.6 installed baseline for the next candidate
        if: steps.baseline_cache.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.cold_validation)
        # Storage quota/eviction must not turn an otherwise validated patch red.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/DesignInstalled054
          key: az-native-056-win2022-42809599278-42819472920-42871091253-v1

      - name: Download original installed 0.5.7 Build 36 patch
        uses: actions/download-artifact@v4
        with:
          name: AzDesignNative-0.5.6-to-0.5.7-PATCH
          repository: Mr-Azrack/FreeCAD-Az
          run-id: 42899554668
          github-token: ${{ github.token }}
          path: installed-057-build36

      - name: Verify and reconstruct original 0.5.7 Build 36
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $previous = Get-ChildItem 'installed-057-build36' -Recurse -File -Filter 'AzDesignNative-0.5.6-to-0.5.7.azpatch' | Select-Object -First 1
          $checksum = Get-ChildItem 'installed-057-build36' -Recurse -File -Filter 'AzDesignNative-0.5.6-to-0.5.7.azpatch.sha256' | Select-Object -First 1
          if (!$previous -or !$checksum) { throw 'Pinned 0.5.7 Build 36 patch and checksum are required' }
          $expected = ((Get-Content $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $previous.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $actual -ne $expected) { throw 'Original Build 36 patch SHA256 mismatch' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/ApplyAzPatch.ps1 -InstallDir "$baseline" -PatchZip "$($previous.FullName)" -NoUI
          if ($LASTEXITCODE -ne 0) { throw 'Original 0.5.7 Build 36 was not reconstructed correctly' }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.product -ne 'AzDesignNative' -or $marker.version -ne '0.5.7') { throw 'Incorrect 0.5.7 baseline' }

      - name: Download original published 0.5.8 Build 39 patch
        uses: actions/download-artifact@v4
        with:
          name: AzDesignNative-0.5.7-to-0.5.8-PATCH
          repository: Mr-Azrack/FreeCAD-Az
          run-id: 42949194221
          github-token: ${{ github.token }}
          path: installed-058-build39

      - name: Verify and reconstruct original 0.5.8 Build 39
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $previous = Get-ChildItem 'installed-058-build39' -Recurse -File -Filter 'AzDesignNative-0.5.7-to-0.5.8.azpatch' | Select-Object -First 1
          $checksum = Get-ChildItem 'installed-058-build39' -Recurse -File -Filter 'AzDesignNative-0.5.7-to-0.5.8.azpatch.sha256' | Select-Object -First 1
          if (!$previous -or !$checksum) { throw 'Pinned published 0.5.8 Build 39 patch/checksum required' }
          $expected = ((Get-Content $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $previous.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $actual -ne $expected) { throw 'Published 0.5.8 source patch SHA256 mismatch' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/ApplyAzPatch.ps1 -InstallDir "$baseline" -PatchZip "$($previous.FullName)" -NoUI
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reconstruct published 0.5.8 Build 39 baseline' }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.product -ne 'AzDesignNative' -or $marker.version -ne '0.5.8') { throw 'Incorrect installed 0.5.8 baseline' }

      - name: Download verified published 0.5.9 Build 40 patch
        uses: actions/download-artifact@v4
        with:
          name: AzDesignNative-0.5.8-to-0.5.9-PATCH
          repository: Mr-Azrack/FreeCAD-Az
          run-id: 42959009956
          github-token: ${{ github.token }}
          path: installed-059-build40

      - name: Reconstruct exact installed 0.5.9 baseline
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $previous = Get-ChildItem 'installed-059-build40' -Recurse -File -Filter 'AzDesignNative-0.5.8-to-0.5.9.azpatch' | Select-Object -First 1
          $checksum = Get-ChildItem 'installed-059-build40' -Recurse -File -Filter 'AzDesignNative-0.5.8-to-0.5.9.azpatch.sha256' | Select-Object -First 1
          if (!$previous -or !$checksum) { throw 'Published 0.5.9 patch/checksum missing' }
          $expected = ((Get-Content $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $previous.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $expected -ne $actual) { throw 'Published 0.5.9 baseline SHA256 mismatch' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/ApplyAzPatch.ps1 -InstallDir "$baseline" -PatchZip "$($previous.FullName)" -NoUI
          if ($LASTEXITCODE -ne 0) { throw 'Cannot reconstruct installed 0.5.9 Build 40 baseline' }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.product -ne 'AzDesignNative' -or $marker.version -ne '0.5.9') { throw 'Incorrect 0.5.9 baseline' }

      - name: Build changed-only overlay (no native core re-download)
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $old = Join-Path $env:RUNNER_TEMP 'DesignDeltaOld'
          $new = Join-Path $env:RUNNER_TEMP 'DesignDeltaNew'
          foreach ($dir in @($old,$new)) {
            New-Item -ItemType Directory (Join-Path $dir 'Mod') -Force | Out-Null
          }
          # Only our owned workspace and updater files are eligible for a routine patch.
          # This prevents accidental FreeCAD runtime, C++ DLL or uninstaller changes.
          Copy-Item (Join-Path $baseline 'Mod\AzDesign') (Join-Path $old 'Mod\AzDesign') -Recurse
          Copy-Item 'addons\AzDesign' (Join-Path $new 'Mod\AzDesign') -Recurse
          Copy-Item (Join-Path $baseline 'ApplyAzPatch.ps1') (Join-Path $old 'ApplyAzPatch.ps1')
          Copy-Item 'native-core\windows\ApplyAzPatch.ps1' (Join-Path $new 'ApplyAzPatch.ps1')
          Copy-Item (Join-Path $baseline 'AzUpdater.exe') (Join-Path $old 'AzUpdater.exe')
          Copy-Item (Join-Path $baseline 'AzDesign.exe') (Join-Path $old 'AzDesign.exe')
          $csc = Join-Path $env:windir 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          $icon = Join-Path $env:RUNNER_TEMP 'Az.ico'
          Add-Type -AssemblyName System.Drawing
          $ico = [Drawing.Icon]::ExtractAssociatedIcon((Join-Path $baseline 'bin\FreeCAD.exe'))
          $iconArgs = @()
          if ($ico) {
            $stream = [IO.File]::Create($icon)
            try { $ico.Save($stream) } finally { $stream.Dispose(); $ico.Dispose() }
            $iconArgs = @("/win32icon:$icon")
          }
          $launcherSource = (Resolve-Path 'native-core/windows/AzDesignLauncher.cs').Path
          & $csc /nologo /codepage:65001 /target:winexe "/out:$(Join-Path $new 'AzDesign.exe')" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Xml.dll @iconArgs "$launcherSource"
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher compile failed' }
          $updaterSource = (Resolve-Path 'native-core/windows/AzUpdater.cs').Path
          $onlineSource = (Resolve-Path 'native-core/windows/AzOnlineUpdates.cs').Path
          & $csc /nologo /codepage:65001 /target:winexe "/out:$(Join-Path $new 'AzUpdater.exe')" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll @iconArgs "$updaterSource" "$onlineSource"
          if ($LASTEXITCODE -ne 0) { throw 'Native updater compile failed' }
          New-Item -ItemType Directory 'dist' -Force | Out-Null
          $patch = Join-Path (Resolve-Path 'dist').Path 'AzDesignNative-0.5.9-to-0.5.10.azpatch'
          python native-core/windows/create_patch.py --old "$old" --new "$new" --output "$patch" --from-version 0.5.9 --to-version 0.5.10
          if ($LASTEXITCODE -ne 0) { throw 'Patch creation failed' }
          $patch | Set-Content 'patch-path.txt'
      - name: Apply to real installed baseline, Qt smoke, rollback, uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content 'baseline-path.txt' -Raw).Trim()
          $patch = (Get-Content 'patch-path.txt' -Raw).Trim()
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/ApplyAzPatch.ps1 -InstallDir "$baseline" -PatchZip "$patch" -NoUI
          if ($LASTEXITCODE -ne 0) { throw 'Real installed 0.5.9 Build 40 rejected 0.5.10 patch' }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.version -ne '0.5.10') { throw 'Patched version is not 0.5.10' }
          $env:PYTHONNOUSERSITE = '1'
          & (Join-Path $baseline 'bin\python.exe') native-core/windows/smoke_qt.py --bundle "$baseline"
          if ($LASTEXITCODE -ne 0) { throw 'Qt startup failed after patch' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File native-core/windows/ApplyAzPatch.ps1 -InstallDir "$baseline" -RollbackLatest -NoUI
          if ($LASTEXITCODE -ne 0) { throw 'Rollback failed' }
          $marker = Get-Content (Join-Path $baseline 'AZ Native Version.json') -Raw | ConvertFrom-Json
          if ($marker.version -ne '0.5.9') { throw 'Original version was not restored' }
          if ('${{ steps.baseline_cache.outputs.cache-hit }}' -ne 'true') {
            # Only a fresh installer run has the OS registry registration
            # needed for a meaningful Inno Setup uninstall test.
            $uninstaller = Join-Path $baseline 'unins000.exe'
            $uninstall = Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
            if ($uninstall.ExitCode -ne 0) { throw 'Baseline uninstall failed' }
          } else {
            Write-Host 'Cached baseline patch/Qt/rollback verified; cold run checks native uninstaller.'
          }
          $hash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $patch -Leaf)" | Set-Content "$patch.sha256"
      - name: Upload tested incremental patch (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: AzDesignNative-0.5.9-to-0.5.10-PATCH
